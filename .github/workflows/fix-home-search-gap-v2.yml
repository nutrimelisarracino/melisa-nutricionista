name: Separar casita y lupa móvil v2

on:
  push:
    paths:
      - 'header-gap-trigger-v2.txt'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar separación
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'FIX SEPARACION INICIO LUPA MOBILE 2026-10-02 V2'
          css = '''\n<style id="mobile-home-search-gap-fix-v2">\n  /* FIX SEPARACION INICIO LUPA MOBILE 2026-10-02 V2 */\n  @media (max-width: 720px) {\n    .mobile-home-link { left:72px !important; }\n    .site-search-toggle { left:126px !important; margin-left:0 !important; }\n  }\n</style>\n'''
          if marker not in s:
              s = s.replace('</head>', css + '</head>', 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Guardar cambio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Separar casita y lupa en cabecera móvil" || exit 0
          git push
