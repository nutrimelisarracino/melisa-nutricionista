name: Mover modalidad y duración debajo del título
on:
  push:
    paths:
      - 'consult-meta-left.trigger'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajustar tarjetas de consultas
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='/* CONSULT META LEFT UNDER TITLE */'
          css='''\n    /* CONSULT META LEFT UNDER TITLE */\n    #consultas .consult-option-summary{\n      grid-template-columns:minmax(0,1fr) 42px !important;\n      grid-template-rows:auto auto;\n      align-items:center;\n    }\n    #consultas .consult-option-summary .consult-option-main{\n      grid-column:1;\n      grid-row:1;\n    }\n    #consultas .consult-option-summary .consult-meta{\n      grid-column:1;\n      grid-row:2;\n      justify-content:flex-start !important;\n      margin:6px 0 0 !important;\n    }\n    #consultas .consult-option-summary .consult-option-toggle{\n      grid-column:2;\n      grid-row:1 / span 2;\n      align-self:center;\n    }\n'''
          if marker not in s:
              pos=s.rfind('</style>')
              if pos<0: raise SystemExit('No se encontró </style>')
              s=s[:pos]+css+s[pos:]
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Mover modalidad y duración debajo del título'
          git push
