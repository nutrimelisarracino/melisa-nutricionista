name: Ajustar diseño de Andrea

on:
  push:
    paths:
      - 'tune-andrea-layout-trigger.txt'

permissions:
  contents: write

jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ajustar franjas de Andrea y Carla
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* Ajuste visual equipo: descripciones más anchas y franjas compactas · 03/10/2026 */'
          if marker not in s:
              css = '''\n    /* Ajuste visual equipo: descripciones más anchas y franjas compactas · 03/10/2026 */\n    #equipo .proposal-summary-copy p {\n      max-width: 760px !important;\n      text-wrap: pretty !important;\n    }\n    #equipo .proposal-card-coach[open] .proposal-summary,\n    #equipo .proposal-card-kitchen[open] .proposal-summary {\n      min-height: 0 !important;\n      height: auto !important;\n      padding-top: 20px !important;\n      padding-bottom: 20px !important;\n    }\n    @media (max-width: 900px) {\n      #equipo .proposal-summary-copy p {\n        max-width: none !important;\n      }\n      #equipo .proposal-card-coach[open] .proposal-summary,\n      #equipo .proposal-card-kitchen[open] .proposal-summary {\n        min-height: 0 !important;\n        height: auto !important;\n        padding-top: 16px !important;\n        padding-bottom: 16px !important;\n      }\n    }\n'''
              s = s.replace('</style>', css + '  </style>', 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Guardar cambio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Compactar franjas de Andrea y Carla"
          git push
