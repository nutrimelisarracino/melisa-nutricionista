name: Fix encabezado móvil

on:
  push:
    paths:
      - 'mobile-header-fix.trigger'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Ajustar logo y lupa
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'NUTRIELITE MOBILE HEADER FIX 2026-10-02'
          if marker in s:
              print('El ajuste ya está presente.')
              raise SystemExit(0)

          css = r'''
<style id="nutrielite-mobile-header-fix">
/* NUTRIELITE MOBILE HEADER FIX 2026-10-02 */
@media (max-width: 900px) {
  .site-header .nav {
    position: relative !important;
    display: grid !important;
    grid-template-columns: 46px minmax(0,1fr) 46px auto !important;
    align-items: center !important;
    gap: 8px !important;
    width: calc(100% - 20px) !important;
    min-height: 78px !important;
  }
  .top-logo-link {
    position: absolute !important;
    left: 50% !important;
    top: 50% !important;
    transform: translate(-50%,-50%) !important;
    z-index: 3 !important;
    margin: 0 !important;
    padding: 0 !important;
    background: transparent !important;
    border: 0 !important;
    box-shadow: none !important;
  }
  .top-logo {
    display: block !important;
    width: 88px !important;
    height: auto !important;
    background: transparent !important;
    border: 0 !important;
    box-shadow: none !important;
    mix-blend-mode: normal !important;
  }
  .site-search-toggle {
    position: absolute !important;
    left: calc(50% - 112px) !important;
    top: 50% !important;
    transform: translateY(-50%) !important;
    z-index: 4 !important;
    width: 42px !important;
    height: 42px !important;
    min-width: 42px !important;
    min-height: 42px !important;
    margin: 0 !important;
    padding: 0 !important;
    display: inline-flex !important;
    align-items: center !important;
    justify-content: center !important;
    border-radius: 12px !important;
  }
  .site-search-toggle svg { width: 20px !important; height: 20px !important; }
}
@media (prefers-color-scheme: dark) {
  .site-header,
  .nav-shell { background: #fdfdf5 !important; color: #17342d !important; }
  .site-search-toggle {
    background: #f7f3ea !important;
    color: #873b55 !important;
    border-color: rgba(135,59,85,.24) !important;
    box-shadow: 0 4px 14px rgba(0,0,0,.18) !important;
  }
  .site-search-toggle svg { stroke: #873b55 !important; }
}
</style>
'''
          if '</head>' not in s:
              raise RuntimeError('No se encontró </head>.')
          s = s.replace('</head>', css + '\n</head>', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit del ajuste
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Adaptar logo y lupa del encabezado móvil a modo claro y oscuro"
          git push
