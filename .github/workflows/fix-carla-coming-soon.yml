name: Corregir Próximamente de Carla

on:
  push:
    paths:
      - 'fix-carla-coming-soon-trigger.txt'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ajustar bloque de Carla
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Reparar el cierre de <summary> que quedó eliminado al quitar Próximamente.
          pattern = r'(<details class="proposal-card proposal-card-kitchen">[\s\S]*?<span class="proposal-toggle" aria-hidden="true">\+</span>)(\s*)(<div class="proposal-content">)'
          s, n = re.subn(pattern, r'\1\n            </summary>\n            \3', s, count=1)
          if n == 0:
              raise SystemExit('No se encontró el bloque de Carla para reparar.')

          # Mantener eliminado el indicador Próximamente de la tarjeta cerrada.
          s = s.replace('<span class="coming">Próximamente</span>', '')

          p.write_text(s, encoding='utf-8')
          PY
      - name: Guardar cambio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Reparar estructura del bloque de Carla"
          git push
